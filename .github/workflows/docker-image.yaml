name: tests-and-image

# Tests on every push/PR; the container image is BUILT on PRs and main, PUSHED only from main.
# One image, two platforms: amd64 for the NAS (printer-int.guild42.ch, simulator) and arm64 for
# the Raspberry Pi 4 next to the real printer. Device vs. simulator is decided at runtime by the
# device node (app.py hardware_vorhanden), so both sites run the same digest.

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest
      - run: pytest -q

  image:
    needs: test
    # PRs build both platforms without pushing, so a broken arm64 build shows before the merge.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/plaintext-gmbh/guild42-label-printer:latest
            ghcr.io/plaintext-gmbh/guild42-label-printer:${{ github.sha }}
